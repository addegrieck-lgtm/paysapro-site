# Mise en ligne gratuite sur GitHub Pages à chaque push sur main :
# vérifications (lint, types, tests, secrets) → build → publication.
# Prérequis (une seule fois) : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
# Adresse : https://addegrieck-lgtm.github.io/paysapro-site/
# Les valeurs peuvent être remplacées par des variables du dépôt (Settings → Secrets and variables → Actions → Variables).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/paysapro-site/' }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://addegrieck-lgtm.github.io/paysapro-site' }}
      VITE_APP_URL: ${{ vars.VITE_APP_URL || 'https://addegrieck-lgtm.github.io/paysapro-ai/' }}
      VITE_APP_SIGNUP_PATH: ${{ vars.VITE_APP_SIGNUP_PATH || '#/onboarding' }}
      VITE_APP_LOGIN_PATH: ${{ vars.VITE_APP_LOGIN_PATH || '#/app' }}
      VITE_GOOGLE_SITE_VERIFICATION: ${{ vars.VITE_GOOGLE_SITE_VERIFICATION }}
      VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
      VITE_LEAD_ENDPOINT: ${{ vars.VITE_LEAD_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:secrets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
